backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "website"
    label: "1. HAUPTSEITE & UNTERSEITEN"
    files:
      - name: "site"
        label: "Hauptseite Formular"
        file: "content/site.json"
        format: "json"
        fields:
          # ==========================================
          # LOGO / NAVIGATION
          # ==========================================
          - {label: "--- LOGO & MENÜ (GANZ OBEN) ---", name: "div_nav", widget: "hidden", required: false}
          - {label: "Logo Name (Aktuell: J.S. Vespera)", name: "brand_name", widget: "string", required: false}

          # ==========================================
          # STARTSEITE 1: HERO
          # ==========================================
          - {label: "--- STARTSEITE: OBERSTER BEREICH (HERO) ---", name: "div_h1", widget: "hidden", required: false}
          - {label: "Kleine Textzeile oben (Aktuell: J.S. Vespera)", name: "home_accent", widget: "string", required: false}
          - {label: "Große Überschrift 1 (Aktuell: Gefährliche Worte.)", name: "home_title", widget: "string", required: false}
          - {label: "Große Überschrift 2 (Aktuell: VERBOTENE WAHRHEITEN.)", name: "home_title_2", widget: "string", required: false}
          - {label: "Einleitungstext", name: "home_lead", widget: "text", required: false}
          - {label: "Button Text (Aktuell: ENTDECKE MEINE WELT)", name: "home_button_text", widget: "string", required: false}
          - {label: "Hintergrundbild oben", name: "hero_image", widget: "image", required: false}

          # ==========================================
          # STARTSEITE 2: ÜBER MICH VORSCHAU
          # ==========================================
          - {label: "--- STARTSEITE: ÜBER MICH VORSCHAU-BEREICH ---", name: "div_h2", widget: "hidden", required: false}
          - {label: "Autorenfoto links hochladen", name: "home_about_image", widget: "image", required: false}
          - {label: "Kleine Zeile drüber (Aktuell: Über mich)", name: "home_about_subtitle", widget: "string", required: false}
          - {label: "Große Überschrift (Aktuell: DIE WORTE HINTER DEN GESCHICHTEN.)", name: "home_about_title", widget: "string", required: false}
          - {label: "Text Absatz 1", name: "home_about_p1", widget: "text", required: false}
          - {label: "Text Absatz 2", name: "home_about_p2", widget: "text", required: false}
          - {label: "Button (Aktuell: MEHR ÜBER MICH)", name: "home_about_btn", widget: "string", required: false}
          
          # Die 4 Kacheln rechts
          - {label: "Kachel 1 Titel (Aktuell: Gefährliche Liebe)", name: "feature_1_title", widget: "string", required: false}
          - {label: "Kachel 1 Text", name: "feature_1_text", widget: "text", required: false}
          - {label: "Kachel 2 Titel (Aktuell: Starke Heldinnen)", name: "feature_2_title", widget: "string", required: false}
          - {label: "Kachel 2 Text", name: "feature_2_text", widget: "text", required: false}
          - {label: "Kachel 3 Titel (Aktuell: Morally Grey)", name: "feature_3_title", widget: "string", required: false}
          - {label: "Kachel 3 Text", name: "feature_3_text", widget: "text", required: false}
          - {label: "Kachel 4 Titel (Aktuell: Dunkel. Intensiv.)", name: "feature_4_title", widget: "string", required: false}
          - {label: "Kachel 4 Text", name: "feature_4_text", widget: "text", required: false}

          # ==========================================
          # STARTSEITE 3: BÜCHER
          # ==========================================
          - {label: "--- STARTSEITE: BÜCHER BEREICH ---", name: "div_h3", widget: "hidden", required: false}
          - {label: "Kleine Zeile links (Aktuell: Meine Bücher)", name: "books_sec_sub", widget: "string", required: false}
          - {label: "Überschrift links (Aktuell: TAUCHE EIN IN MEINE WELT.)", name: "books_sec_title", widget: "string", required: false}
          - {label: "Einleitungstext links", name: "books_sec_text", widget: "text", required: false}
          
          - {label: "Buch-Vorschau Badge (Aktuell: DEBÜTROMAN · DARK ROMANCE)", name: "home_book_badge", widget: "string", required: false}
          - {label: "Buch-Vorschau Titel (Aktuell: DEADLY WORDS)", name: "home_book_title", widget: "string", required: false}
          - {label: "Buch-Vorschau Teaser", name: "home_book_teaser", widget: "text", required: false}
          - {label: "Buch-Vorschau Button (Aktuell: MEHR ZUM BUCH)", name: "home_book_btn", widget: "string", required: false}
          - {label: "Buch-Vorschau Cover hochladen", name: "home_book_cover", widget: "image", required: false}

          - {label: "Dunkler Zitat-Kasten (Aktuell: „Du lügst für die Toten...“)", name: "quote_box_text", widget: "text", required: false}

          # ==========================================
          # SEITE: ÜBER MICH
          # ==========================================
          - {label: "--- SEITE: ÜBER MICH ---", name: "div_p_about", widget: "hidden", required: false}
          - {label: "Roter Kasten Badge (Aktuell: DIE AUTORIN)", name: "about_header_badge", widget: "string", required: false}
          - {label: "Roter Kasten Titel (Aktuell: Über mich)", name: "about_title", widget: "string", required: false}
          - {label: "Roter Kasten Einleitung", name: "about_intro", widget: "text", required: false}
          
          - {label: "Autorenfoto Unterseite hochladen", name: "about_page_image", widget: "image", required: false}
          - {label: "Überschrift (Aktuell: Wer hinter J.S. Vespera steckt)", name: "about_bio_title", widget: "string", required: false}
          - {label: "Vorstellungstext", name: "about_story", widget: "text", required: false}

          - {label: "Karte 1 Titel (Aktuell: Mein Weg zum Schreiben)", name: "card_1_title", widget: "string", required: false}
          - {label: "Karte 1 Text", name: "card_1_text", widget: "text", required: false}
          - {label: "Karte 2 Titel (Aktuell: Meine Inspiration)", name: "card_2_title", widget: "string", required: false}
          - {label: "Karte 2 Text", name: "card_2_text", widget: "text", required: false}
          - {label: "Karte 3 Titel (Aktuell: Dark Romance)", name: "card_3_title", widget: "string", required: false}
          - {label: "Karte 3 Text", name: "card_3_text", widget: "text", required: false}
          - {label: "Karte 4 Titel (Aktuell: Meine Bücher)", name: "card_4_title", widget: "string", required: false}
          - {label: "Karte 4 Text", name: "card_4_text", widget: "text", required: false}

          # ==========================================
          # SONSTIGES & FOOTER
          # ==========================================
          - {label: "--- UNTERSEITEN & FOOTER ---", name: "div_p_other", widget: "hidden", required: false}
          - {label: "Testleser Überschrift", name: "beta_title", widget: "string", required: false}
          - {label: "Testleser Text", name: "beta_body", widget: "text", required: false}
          - {label: "Blogger Überschrift", name: "cooperation_title", widget: "string", required: false}
          - {label: "Blogger Text", name: "cooperation_body", widget: "text", required: false}
          - {label: "E-Mail-Adresse", name: "contact_email", widget: "string", required: false}
          - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
          - {label: "TikTok URL", name: "tiktok", widget: "string", required: false}
          - {label: "Copyright Zeile ganz unten", name: "footer_copyright", widget: "string", required: false}

          # ==========================================
          # RECHTLICHES
          # ==========================================
          - {label: "--- RECHTLICHES ---", name: "div_legal", widget: "hidden", required: false}
          - {label: "Impressum", name: "impressum", widget: "markdown", required: false}
          - {label: "Datenschutzerklärung", name: "privacy", widget: "markdown", required: false}

  - name: "books_collection"
    label: "2. BUCH-UNTERSEITE (DEADLY WORDS)"
    files:
      - name: "deadly_words"
        label: "Deadly Words Unterseite bearbeiten"
        file: "content/books.json"
        format: "json"
        fields:
          - {label: "=== OBERER BEREICH ===", name: "sb1", widget: "hidden", required: false}
          - {label: "Roter Badge (Aktuell: DEBÜTROMAN · DARK ROMANCE)", name: "badge", widget: "string", required: false}
          - {label: "Script-Zeile (Aktuell: Gefährliche Worte.)", name: "hook_line", widget: "string", required: false}
          - {label: "Buchtitel (Aktuell: DEADLY WORDS)", name: "title", widget: "string", required: false}
          - {label: "Untertitel (Aktuell: Jedes Wort eine Lüge.)", name: "subtitle", widget: "string", required: false}
          - {label: "Großes Zitat (Aktuell: DU LÜGST FÜR DIE TOTEN...)", name: "quote_text", widget: "text", required: false}
          - {label: "Genre Tags (Aktuell: DARK ROMANCE, PSYCHOLOGISCH, 18+)", name: "header_tags", widget: "string", required: false}
          - {label: "Cover-Bild hochladen", name: "cover", widget: "image", required: false}
          - {label: "URL Kürzel (Aktuell: deadly-words)", name: "slug", widget: "string", required: false}

          - {label: "=== INFOLEISTE & KLAPPENTEXT ===", name: "sb2", widget: "hidden", required: false}
          - {label: "Genre (Aktuell: Dark Romance)", name: "genre", widget: "string", required: false}
          - {label: "Status (Aktuell: In Überarbeitung / Testlesephase)", name: "status", widget: "string", required: false}
          - {label: "Seitenanzahl (Aktuell: ca. 400 Seiten)", name: "pages", widget: "string", required: false}
          - {label: "Erscheinungsdatum (Aktuell: Dezember 2026)", name: "release", widget: "string", required: false}
          - {label: "Klappentext Einleitung (Aktuell: Ein verbotenes Spiel...)", name: "blurb_intro", widget: "string", required: false}
          - {label: "Klappentext Haupttext", name: "blurb", widget: "text", required: false}

          - {label: "=== TROPES & ECHTHEIT ===", name: "sb3", widget: "hidden", required: false}
          - {label: "Tropes Kacheln (Aktuell: DARK ROMANCE, OBSESSION...)", name: "tropes_list", widget: "string", required: false}
          - {label: "Tropes Hinweis", name: "tropes_text", widget: "text", required: false}
          - {label: "Echtheit Untertitel (Aktuell: Was ist echt? Was ist inspiriert?)", name: "reality_subtitle", widget: "string", required: false}
          - {label: "Echtheit Haupttext", name: "reality", widget: "text", required: false}

          - {label: "=== TRIGGERWARNUNGEN & KAUFLINKS ===", name: "sb4", widget: "hidden", required: false}
          - {label: "Triggerwarnungen (eine pro Zeile)", name: "triggers", widget: "text", required: false}
          - {label: "Leseprobe PDF hochladen", name: "sample_link", widget: "file", required: false}
          - {label: "Kauf-Link (Shop)", name: "buy_link", widget: "string", required: false}
