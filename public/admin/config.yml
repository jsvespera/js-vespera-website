backend:
  name: git-gateway
  branch: main

media_folder: public/assets/images
public_folder: /assets/images

collections:
  - name: "books"
    label: "Bücher"
    files:
      - file: "content/books.json"
        label: "Aktuelles Buch"
        name: "current_book"
        fields:
          - { label: "Badge", name: "badge", widget: "string" }
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Untertitel", name: "subtitle", widget: "string" }
          - { label: "Klappentext", name: "description", widget: "text" }
          - { label: "Button-Text", name: "buttonText", widget: "string" }
          - { label: "Button-Link", name: "buttonLink", widget: "string" }

  - name: "site"
    label: "Website Einstellungen"
    files:
      - file: "content/site.json"
        label: "Seiten-Inhalte"
        name: "site_content"
        fields:
          - { label: "Website Titel", name: "siteTitle", widget: "string" }
          - { label: "Über mich Text", name: "aboutText", widget: "text" }
